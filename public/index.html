<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>West Duel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #14100e; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    color: #fff; user-select: none; touch-action: none;
  }
  #arena { display: block; width: 100%; height: 100%; }

  #status {
    position: absolute; top: 76px; left: 50%; transform: translateX(-50%);
    font-size: 17px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    pointer-events: none; z-index: 5;
  }

  .hp-group { position: absolute; top: 10px; width: 40%; display: flex; flex-direction: column; gap: 3px; }
  #hp-group-0 { left: 10px; }
  #hp-group-1 { right: 10px; align-items: flex-end; }
  .hp-name { font-size: 12px; font-weight: bold; color: rgba(255,255,255,0.9); text-shadow: 0 1px 3px rgba(0,0,0,0.9); }
  .hp-container { width: 100%; height: 12px; background: rgba(0,0,0,0.5); border: 1.5px solid rgba(255,255,255,0.8); border-radius: 6px; overflow: hidden; }
  .hp-bar { height: 100%; width: 100%; transition: width 0.15s ease-out; background: linear-gradient(#c94b4b, #8f2f2f); }
  #hp-bar-0 { background: linear-gradient(#5b9a5b, #3d6e3d); }

  #ammo-wrap {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 190px;
    text-align: center; z-index: 5;
  }
  #weapon-name { font-size: 13px; font-weight: bold; color: #ffe066; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
  #ammo-count { font-size: 20px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

  #joystick-zone {
    position: absolute; left: 24px; bottom: 50px; width: 130px; height: 130px;
    border-radius: 50%; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3);
  }
  #joystick-knob {
    position: absolute; left: 51px; top: 51px; width: 28px; height: 28px;
    border-radius: 50%; background: rgba(255,255,255,0.8);
  }

  #fire-btn {
    position: absolute; right: 24px; bottom: 50px; width: 120px; height: 120px;
    border-radius: 50%; background: rgba(255,90,60,0.35); border: 2px solid rgba(255,140,100,0.6);
    color: #fff; font-size: 16px; font-weight: bold; transition: opacity 0.2s;
  }
  #switch-btn {
    position: absolute; right: 60px; bottom: 190px; width: 76px; height: 76px;
    border-radius: 50%; background: rgba(120,140,220,0.3); border: 2px solid rgba(160,180,240,0.6);
    color: #fff; font-size: 11px; font-weight: bold;
  }
  .btn-disabled { opacity: 0.35; }

  #hit-flash {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(rgba(180,0,0,0.45), rgba(120,0,0,0.1) 70%);
    opacity: 0; pointer-events: none; transition: opacity 0.1s; z-index: 4;
  }
  #xray-flash {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(160,220,255,0.5);
    opacity: 0; pointer-events: none; transition: opacity 0.08s; z-index: 4;
  }

  #menu-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(#2b1c12, #4a2f1a);
    display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10;
  }
  #menu-title { font-size: 32px; font-weight: bold; letter-spacing: 1px; margin-bottom: 6px; text-shadow: 0 3px 6px rgba(0,0,0,0.6); }
  #menu-subtitle { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 26px; text-align: center; padding: 0 30px; line-height: 1.5; }
  .diff-btn {
    width: 230px; height: 54px; border-radius: 27px; border: none; margin-top: 10px;
    font-size: 17px; font-weight: bold; letter-spacing: 0.5px; color: #1a1410;
  }
  #diff-easy { background: linear-gradient(#8fd18f, #5aa35a); }
  #diff-medium { background: linear-gradient(#ffe066, #e0a824); }
  #diff-hard { background: linear-gradient(#ff8f6b, #d9502e); color: #fff; }
</style>
</head>
<body>

<canvas id="arena"></canvas>
<div id="hit-flash"></div>
<div id="xray-flash"></div>
<div id="status"></div>

<div class="hp-group" id="hp-group-0">
  <div class="hp-name" id="name-0">Ты</div>
  <div class="hp-container"><div class="hp-bar" id="hp-bar-0"></div></div>
</div>
<div class="hp-group" id="hp-group-1">
  <div class="hp-name" id="name-1">Бот</div>
  <div class="hp-container"><div class="hp-bar" id="hp-bar-1"></div></div>
</div>

<div id="ammo-wrap">
  <div id="weapon-name">USP</div>
  <div id="ammo-count">12</div>
</div>

<div id="joystick-zone"><div id="joystick-knob"></div></div>
<button id="switch-btn">СМЕНА<br>ОРУЖИЯ</button>
<button id="fire-btn">ОГОНЬ</button>

<div id="menu-overlay">
  <div id="menu-title">🤠 WEST DUEL</div>
  <div id="menu-subtitle">USP с глушителем — быстрый, слабее.<br>Дигл — редкий, но мощный, с шансом критического выстрела.<br>Критический выстрел валит соперника — добей его, пока он на земле.</div>
  <button class="diff-btn" id="online-btn" style="background: linear-gradient(#6bb8ff, #3d7ec7); color:#0d1b2a;">🌐 ОНЛАЙН (PvP)</button>
  <button class="diff-btn" id="diff-easy">🟢 ЛЁГКИЙ БОТ</button>
  <button class="diff-btn" id="diff-medium">🟡 СРЕДНИЙ БОТ</button>
  <button class="diff-btn" id="diff-hard">🔴 ТЯЖЁЛЫЙ БОТ</button>
  <div id="online-counter" style="margin-top:20px; font-size:12px; color:rgba(255,255,255,0.5);">Сейчас играют: <span id="online-count">—</span></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>
</body>
</html>
